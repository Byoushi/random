<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Counter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }
    button {
      font-size: 18px;
      padding: 8px 16px;
      margin: 5px;
    }
    #count {
      font-size: 40px;
    }
  </style>
</head>
<body>

  <h1>Counter</h1>
  <p id="count">0</p>
  <button onclick="minus()">-</button>
  <button onclick="reset()">Reset</button>
  <button onclick="plus()">+</button>

  <script>
    let number = 0;
    let countText = document.getElementById("count");

    function plus() {
      number = number + 1;
      countText.innerHTML = number;
    }

    function minus() {
      number = number - 1;
      countText.innerHTML = number;
    }

    function reset() {
      number = 0;
      countText.innerHTML = number;
    }
  </script>

</body>
</html>
